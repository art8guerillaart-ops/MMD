name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target VSTDrumm_VST3 VSTDrumm_Standalone --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/VSTDrumm_artefacts/Release/VST3/MMD.vst3" out/
          Copy-Item "build/VSTDrumm_artefacts/Release/Standalone/MMD.exe" out/
          Copy-Item README.md out/
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc installer\MMD.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: MMD-Windows
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: MMD-Setup
          path: out/MMD Setup.exe
